<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper and Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <div class="score-container">
            <div class="player-section">
                <div class="name">Player</div>
                <div class="score">0</div>
            </div>
            <span>x</span>
            <div class="computer-section">
                <div class="name">Computer</div>
                <div class="score">0</div>
            </div>
        </div>

        <div class="btns-container">
            <button class="choice-btn" data-value="rock">Rock</button>
            <button class="choice-btn" data-value="paper">Paper</button>
            <button class="choice-btn" data-value="scissors">Scissors</button>
        </div>



        <div class="round-log">Choose your weapon!</div>
    </div>
</body>

</html>
